<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Predict Revenue</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4 mb-5">
    <h1 class="text-primary mb-4">Enterprise Details</h1>

    {% if error %}
    <div class="alert alert-danger">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/predict">

        <div class="row">

            <div class="col-md-6 mb-3">
                <label class="form-label">
                    Enterprise Jurisdiction
                </label>
                <input
                    type="text"
                    name="enterprise_group_jurisdiction"
                    class="form-control"
                    placeholder="Example: US-DE"
                    required>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">
                    Company Type
                </label>
                <select name="company_type" class="form-select" required>
                    <option value="PUBLIC">PUBLIC</option>
                    <option value="PRIVATE">PRIVATE</option>
                    <option value="STATE_OWNED">STATE_OWNED</option>
                    <option value="OTHER">OTHER</option>
                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Employees</label>
                <input
                    type="number"
                    name="employees"
                    class="form-control"
                    step="any">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Employees Year</label>
                <input
                    type="number"
                    name="employees_year"
                    class="form-control"
                    value="2025">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Revenue Currency</label>
                <select name="revenue_currency" class="form-select">
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                    <option value="GBP">GBP</option>
                    <option value="JPY">JPY</option>
                    <option value="INR">INR</option>
                    <option value="CAD">CAD</option>
                    <option value="AUD">AUD</option>
                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Revenue Year</label>
                <input
                    type="number"
                    name="revenue_year"
                    class="form-control"
                    value="2025">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Net Income</label>
                <input
                    type="number"
                    name="net_income"
                    class="form-control"
                    step="any">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Net Income Currency</label>
                <select name="net_income_currency" class="form-select">
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                    <option value="GBP">GBP</option>
                    <option value="JPY">JPY</option>
                    <option value="INR">INR</option>
                    <option value="CAD">CAD</option>
                    <option value="AUD">AUD</option>
                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Net Income Year</label>
                <input
                    type="number"
                    name="net_income_year"
                    class="form-control"
                    value="2025">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Market Capitalization</label>
                <input
                    type="number"
                    name="market_cap"
                    class="form-control"
                    step="any">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Market Cap Currency</label>
                <select name="market_cap_currency" class="form-select">
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                    <option value="GBP">GBP</option>
                    <option value="JPY">JPY</option>
                    <option value="INR">INR</option>
                    <option value="CAD">CAD</option>
                    <option value="AUD">AUD</option>
                </select>
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Market Cap Year</label>
                <input
                    type="number"
                    name="market_cap_year"
                    class="form-control"
                    value="2025">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Legal Units Count</label>
                <input
                    type="number"
                    name="legal_units_count"
                    class="form-control">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Direct Subsidiaries Count</label>
                <input
                    type="number"
                    name="direct_subsidiaries_count"
                    class="form-control">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Maximum Hierarchy Depth</label>
                <input
                    type="number"
                    name="max_hierarchy_depth"
                    class="form-control">
            </div>

            <div class="col-md-6 mb-3">
                <label class="form-label">Standalone Entity</label>
                <select name="is_standalone_entity" class="form-select">
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

        </div>

        <button type="submit" class="btn btn-success mt-3">
            Predict Annual Revenue
        </button>

        <a href="/" class="btn btn-secondary mt-3">
            Home
        </a>
    </form>
</div>
</body>
</html>
